name: DataOps CI Pipeline

on:
  push:
    branches: [main, "feature/*"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create database
        run: python scripts/create_db.py

      - name: Run static analysis
        run: |
          pylint src/ --fail-under=7.0
          black --check src/
          bandit -r src/

      - name: Run unit and integration tests
        run: pytest tests/ --cov=src --cov-report=xml --cov-report=term --ignore=tests/test_data_quality.py

      - name: Run data quality tests
        run: pytest tests/test_data_quality.py

      - name: Train model
        run: python -m src.train

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: models/model.pkl

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            coverage.xml
            data/aggregated_sales.csv